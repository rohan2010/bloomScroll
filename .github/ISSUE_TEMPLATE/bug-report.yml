name: Bug report
description: Something else is broken, including setup problems.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `bash setup.sh`
        2. ...
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Windows (Git Bash)
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: bloomScroll version, browser, Node (`node -v`), and Python if you use Laya.
      placeholder: "v0.1.0, Chrome 130, Node 20.8, Python 3.11"
  - type: textarea
    id: logs
    attributes:
      label: Error output or screenshots
      description: Terminal output from setup.sh or server/start.sh, the service worker console (chrome://extensions → bloomScroll → service worker), or a screenshot.
      render: text
